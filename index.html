<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLOCK FACE — Friends en Directo</title><style>html,body{margin:0;background:#081b40;color:#fff;font-family:monospace}#loading{display:grid;place-items:center;height:100vh}#loading p{font-size:1.2rem;letter-spacing:.05em}</style></head><body><div id="loading"><p>CARGANDO BLOCK FACE...</p></div><script>
(async()=>{const count=19;const base='./assets/v43/';const responses=await Promise.all(Array.from({length:count},(_,i)=>fetch(base+'part-'+String(i).padStart(2,'0')+'.txt')));for(const res of responses){if(!res.ok)throw new Error('Archivo no disponible: '+res.url)}const content=(await Promise.all(responses.map(r=>r.text()))).join('');document.open();document.write(content);document.close()})().catch(e=>{document.getElementById('loading').textContent='No se pudo cargar BLOCK FACE. '+e.message;console.error(e)});
</script></body></html>
